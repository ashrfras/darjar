<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DarJar residence community application.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DarJar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DarJar</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background: #f8f6f2;
      height: 100%;
      margin: 0;
    }

    #darjar-loading {
      align-items: center;
      color: #17151d;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
      inset: 0;
      justify-content: center;
      position: fixed;
    }

    #darjar-loading strong {
      color: #0f766e;
      font-size: 28px;
      margin-bottom: 18px;
    }

    #darjar-loading span {
      border: 3px solid #d5e9e6;
      border-top-color: #0f766e;
      border-radius: 50%;
      height: 30px;
      width: 30px;
      animation: darjar-spin 0.8s linear infinite;
    }

    @keyframes darjar-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="darjar-loading" dir="rtl" role="status" aria-live="polite">
    <strong>دارجار</strong>
    <span aria-hidden="true"></span>
    <p>جارٍ تحميل التطبيق…</p>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(
          'firebase-messaging-sw.js',
          {scope: '/firebase-cloud-messaging-push-scope'},
        );
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
